name: Apply WebDAV reading backup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-webdav-backup.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: mangaflow-webdav-backup
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'wozhenbang2004/MangaFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Stage patch payload one
        run: |
          cat > "$RUNNER_TEMP/webdav-backup.patch.gz.b64" <<'PAYLOAD'
          
          PAYLOAD

      - name: Stage patch payload two
        run: |
          cat >> "$RUNNER_TEMP/webdav-backup.patch.gz.b64" <<'PAYLOAD'
          
          PAYLOAD

      - name: Stage patch payload three
        run: |
          cat >> "$RUNNER_TEMP/webdav-backup.patch.gz.b64" <<'PAYLOAD'
          
          PAYLOAD

      - name: Apply verified source patch
        env:
          PATCH_SHA256: 5715021b2416ac76d3f6dfe1337b82a9387025f4416574c3a202102746cb7736
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATCH_B64="$RUNNER_TEMP/webdav-backup.patch.gz.b64"
          PATCH_FILE="$RUNNER_TEMP/webdav-backup.patch"
          base64 -d "$PATCH_B64" | gzip -d > "$PATCH_FILE"
          printf '%s  %s\n' "$PATCH_SHA256" "$PATCH_FILE" | sha256sum -c -

          git config user.name "Kayokoi"
          git config user.email "113896798+wozhenbang2004@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            if [[ ! -f .github/workflows/apply-webdav-backup.yml ]]; then
              echo "Patch workflow was already consumed."
              exit 0
            fi
            git apply --3way --index "$PATCH_FILE"
            git rm -f .github/workflows/apply-webdav-backup.yml

            expected=$(printf '%s\n' \
              .github/workflows/apply-webdav-backup.yml \
              WEBDAV_BACKUP.md \
              app/src/main/java/dev/mangaflow/storage/WebDavBackupStore.kt \
              app/src/main/java/dev/mangaflow/ui/SettingsScreen.kt | sort)
            actual=$(git diff --cached --name-only | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected staged paths:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
            git diff --cached --check
            git commit -m "加入 WebDAV 精确续读备份"
            if git push origin HEAD:main; then
              gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            echo "main moved while applying; retrying on the latest revision." >&2
          done
          exit 1
