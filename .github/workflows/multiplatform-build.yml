name: Multiplatform applications
run-name: MangaFlow applications · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'desktopApp/**'
      - 'iosApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/native_release.py'
      - 'scripts/build_steam.py'
      - 'native/steam/**'
      - 'third_party/tapline/**'
      - '.github/workflows/multiplatform-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Windows and iOS builds are expensive: new pushes must not cancel older SHAs.
# Keep each commit's run isolated; immutable publication is checked by native_release.py.
concurrency:
  group: mangaflow-applications-${{ github.sha }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.target }} application
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse Gradle build state
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install Android SDK for shared project configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
            $wixBin = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
            if ($wixBin) { "$($wixBin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append }
          }
      - name: Select the matching main release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release.py plan
      - name: Check out pinned Steam protocol source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: UnhingedSoftware/tapline
          ref: f54136611519bef50cf31336e0c28a78eb175657
          path: native/steam/tapline
          persist-credentials: false
      - name: Reuse Steam compiler dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/steam/target
          key: ${{ runner.os }}-${{ runner.arch }}-steam-rust188-msvc-v1-${{ hashFiles('native/steam/Cargo.toml', 'native/steam/src/**', 'native/steam/tapline-bounds.patch', 'scripts/build_steam.py', 'native/steam/tapline/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-steam-rust188-msvc-v1-
      - name: Install pinned Windows Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Build Windows Steam bridge resource
        run: python scripts/build_steam.py --platform windows
      - name: Preserve resolved Steam dependencies and licenses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-steam-windows-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native/steam/build/
            native/steam/Cargo.lock
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile and package the complete desktop application
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Windows installers do not retain an app image; incremental staging requires one.
          ./gradlew --no-daemon --console=plain --max-workers=2 -PmangaVersionName="$MANGA_VERSION" :desktopApp:createReleaseDistributable :desktopApp:packageReleaseDistributionForCurrentOS
      - name: Stage installers and verified incremental file assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release.py stage
      - name: Show Windows packaging failure details
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $logRoot = 'desktopApp/build/compose/logs'
          if (Test-Path -LiteralPath $logRoot) {
            Get-ChildItem -LiteralPath $logRoot -Recurse -File -Filter '*.txt' | ForEach-Object {
              Write-Output "::group::$($_.FullName)"
              Get-Content -LiteralPath $_.FullName
              Write-Output '::endgroup::'
            }
          }
          $argumentRoot = 'desktopApp/build/compose/tmp'
          if (Test-Path -LiteralPath $argumentRoot) {
            Get-ChildItem -LiteralPath $argumentRoot -File -Filter 'package*.args.txt' | ForEach-Object {
              Write-Output "::group::$($_.FullName)"
              Get-Content -LiteralPath $_.FullName
              Write-Output '::endgroup::'
            }
          }
      - name: Preserve Windows packaging diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-packaging-diagnostics-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            desktopApp/build/compose/logs/
            desktopApp/build/compose/tmp/package*.args.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve desktop installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-native-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS application (unsigned)
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      # The standard Intel runner has 14 GB; Kotlin/Native release optimization exhausted 4 GB.
      # Keep the single-worker build and leave 6 GB for Xcode and native allocations.
      MANGAFLOW_IOS_GRADLE_JVMARGS: '-Xmx8g -Dfile.encoding=UTF-8'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse Gradle build state
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Select the matching main release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release.py plan
      - name: Identify the native compiler cache
        id: native-cache
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - name: Reuse Kotlin Native compiler dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-kotlin2421-${{ steps.native-cache.outputs.xcode }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-kotlin2421-${{ steps.native-cache.outputs.xcode }}-
      - name: Generate the native Xcode application project
        run: |
          set -euo pipefail
          chmod +x gradlew
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd iosApp && xcodegen generate)
      - name: Archive the unsigned device application
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/MangaFlow.xcodeproj -scheme MangaFlow -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MangaFlow.xcarchive" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$MANGA_VERSION" CURRENT_PROJECT_VERSION="$MANGA_BUILD_NUMBER" archive
      - name: Compile the complete simulator application
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/MangaFlow.xcodeproj -scheme MangaFlow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MangaFlow-simulator" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$MANGA_VERSION" CURRENT_PROJECT_VERSION="$MANGA_BUILD_NUMBER" build
      - name: Package the unsigned iOS applications
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/MangaFlow-ios-simulator.tar.gz \
            -C "$RUNNER_TEMP/MangaFlow-simulator/Build/Products/Debug-iphonesimulator" MangaFlow.app
          ditto -c -k --keepParent "$RUNNER_TEMP/MangaFlow.xcarchive" dist/MangaFlow-ios-unsigned.xcarchive.zip
      - name: Preserve iOS applications
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-ios-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-windows:
    name: Publish Windows installers to the matching release
    needs: desktop
    if: github.repository == 'wozhenbang2004/MangaFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mangaflow-native-*
          path: dist/native
          merge-multiple: true
      - name: Resolve exact source version and publish immutable installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/native_release.py plan
      - name: Attach Windows assets after the signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release.py publish
