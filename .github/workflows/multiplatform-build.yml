name: Shared platform builds
run-name: MangaFlow shared · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/multiplatform-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaflow-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.target }} library
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop-jvm
            os: ubuntu-24.04
            tasks: ':shared:desktopJar'
            output: 'shared/build/libs/*.jar'
          - target: ios-arm64
            os: macos-latest
            tasks: ':shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64'
            output: 'shared/build/bin/ios*/debugFramework/'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this source version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK for project configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile and package the shared production library
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 ${{ matrix.tasks }}
      - name: Preserve platform library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-shared-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
