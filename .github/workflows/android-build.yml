name: Android build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      full_lint:
        description: Run full Android Lint before packaging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mangaflow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Check out pinned Steam protocol source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: UnhingedSoftware/tapline
          ref: f54136611519bef50cf31336e0c28a78eb175657
          path: native/steam/tapline
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi --target i686-linux-android --target x86_64-linux-android
      - name: Android Lint (release)
        id: lint
        if: github.event_name == 'workflow_dispatch' && inputs.full_lint == true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 :app:lintRelease
          python3 - <<'PY'
          from pathlib import Path
          for suffix in ("html", "xml"):
              report = Path(f"app/build/reports/lint-results-release.{suffix}")
              if not report.is_file() or report.stat().st_size == 0:
                  raise SystemExit(f"Android Lint did not produce the required report: {report}")
          PY

      - name: Preserve Lint reports
        if: always() && steps.lint.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mangaflow-lint-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: error
          retention-days: 14

      - name: Compile and package
        run: ./gradlew --no-daemon --console=plain --max-workers=2 :app:assembleDebug :app:assembleRelease :app:stageInferenceAars
      - name: Build optional Steam component
        run: python3 scripts/build_steam.py --platform android
      - name: Preserve resolved Steam dependencies and licenses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangaflow-steam-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native/steam/build/
            native/steam/Cargo.lock
          if-no-files-found: ignore
          retention-days: 14
      - name: Package optional inference components (unsigned)
        run: |
          python3 scripts/package_runtimes.py \
            --aar-dir app/build/outputs/inference-aars \
            --output app/build/outputs/inference-components \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mangaflow-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/inference-components/
          retention-days: 7
