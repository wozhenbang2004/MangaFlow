name: Apply local manga import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-local-import.yml

permissions:
  contents: write

concurrency:
  group: mangaflow-local-import
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'wozhenbang2004/MangaFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified source patch
        env:
          PATCH_SHA256: ec547b79839a643efd17ece2401706dd3ab511ebb783233cbc707e259b28d71c
        run: |
          set -euo pipefail
          PATCH_B64="$RUNNER_TEMP/local-import.patch.gz.b64"
          PATCH_FILE="$RUNNER_TEMP/local-import.patch"
          cat > "$PATCH_B64" <<'PAYLOAD'

PAYLOAD
          base64 -d "$PATCH_B64" | gzip -d > "$PATCH_FILE"
          printf '%s  %s\n' "$PATCH_SHA256" "$PATCH_FILE" | sha256sum -c -

          git config user.name "Kayokoi"
          git config user.email "113896798+wozhenbang2004@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            if [[ ! -f .github/workflows/apply-local-import.yml ]]; then
              echo "Patch workflow was already consumed."
              exit 0
            fi
            git apply --3way --index "$PATCH_FILE"
            git rm -f .github/workflows/apply-local-import.yml

            expected=$(printf '%s\n' \
              .github/workflows/apply-local-import.yml \
              app/src/main/java/dev/mangaflow/MangaViewModel.kt \
              app/src/main/java/dev/mangaflow/reader/ReaderScreen.kt \
              app/src/main/java/dev/mangaflow/storage/DownloadStore.kt \
              app/src/main/java/dev/mangaflow/ui/DownloadsScreen.kt | sort)
            actual=$(git diff --cached --name-only | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected staged paths:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
            git diff --cached --check
            git commit -m "加入本地漫画导入并复用离线阅读"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved while applying; retrying on the latest revision." >&2
          done
          exit 1
