[package]
name = "mangaflow-steam"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MPL-2.0"

[lib]
name = "mangaflow_steam"
crate-type = ["cdylib"]

[dependencies]
tapline = { path = "tapline/crates/tapline" }
jni-sys = "=0.3.0"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = "=1.9.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
