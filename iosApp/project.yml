name: MangaFlow
options:
  bundleIdPrefix: dev.mangaflow
  deploymentTarget:
    iOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    MANGAFLOW_IOS_DISTRIBUTION_URL: ''
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    'ARCHS[sdk=iphonesimulator*]': arm64
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
    OTHER_LDFLAGS: '$(inherited) -framework MangaFlowShared -lc++'
targets:
  MangaFlow:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../third_party/unicode/LICENSE.txt
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 漫流
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        MangaFlowDistributionURL: '$(MANGAFLOW_IOS_DISTRIBUTION_URL)'
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIViewControllerBasedStatusBarAppearance: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mangaflow.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the complete shared application
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          set -- --no-daemon --console=plain --no-parallel --max-workers=1
          if [ -n "${MANGAFLOW_IOS_GRADLE_JVMARGS:-}" ]; then
            set -- "$@" "-Dorg.gradle.jvmargs=$MANGAFLOW_IOS_GRADLE_JVMARGS" \
              -Pkotlin.native.disableCompilerDaemon=false
          fi
          ./gradlew "$@" :shared:embedAndSignAppleFrameworkForXcode
schemes:
  MangaFlow:
    build:
      targets:
        MangaFlow: all
    run:
      config: Debug
    archive:
      config: Release
